<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR 卡牌对战 · 自定义卡片识别</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

    #hint {
      position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.62); color: #fff; font-size: 15px;
      padding: 10px 20px; border-radius: 999px; z-index: 10;
      text-align: center; white-space: nowrap;
      backdrop-filter: blur(4px); pointer-events: none;
      opacity: 0; transition: opacity .4s;
    }
    #hint.show { opacity: 1; }

    #overlay {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: #0d1117; color: #e6edf3; font-size: 16px; text-align: center; padding: 24px;
    }
    #overlay.hidden { display: none; }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #30363d; border-top-color: #00E5FF;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
